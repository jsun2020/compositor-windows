[package]
name = "compositor-shell"
version.workspace = true
edition.workspace = true

[lib]
name = "compositor_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
compositor-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Pdf", "Graphics_Imaging", "Storage", "Storage_Streams", "UI", "Win32_System_WinRT", "Win32_UI_ColorSystem", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi", "Win32_System_WinRT_Pdf"] }
png = "0.17"
moxcms = "=0.8.1"

[dev-dependencies]
png = "0.17"
moxcms = "=0.8.1"
