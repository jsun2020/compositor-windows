[package]
name = "compositor-engine-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
compositor-engine = { path = "../engine" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["js"] }
console_error_panic_hook = "0.1"
